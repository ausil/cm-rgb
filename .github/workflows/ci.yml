name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (PyGObject, hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            libhidapi-dev \
            pkg-config \
            python3-dev

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (PyGObject, hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            libhidapi-dev \
            pkg-config \
            python3-dev

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pylint setuptools

      - name: Run pylint
        run: python -m pylint cm_rgb setup.py scripts/cm-rgb-cli scripts/cm-rgb-monitor scripts/cm-rgb-gui
